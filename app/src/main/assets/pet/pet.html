<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
* { margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
#pet-container {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
#pet {
  width: 80%; height: 80%;
  transition: transform 0.3s ease;
}

/* Idle breathing animation */
@keyframes breathe {
  0%, 100% { transform: scale(1) translateY(0); }
  50% { transform: scale(1.03) translateY(-2px); }
}

/* Poked reaction */
@keyframes poked {
  0% { transform: scale(1); }
  20% { transform: scale(0.85); }
  40% { transform: scale(1.1); }
  60% { transform: scale(0.95); }
  80% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

/* Angry shake (multi-poke) */
@keyframes angry {
  0%, 100% { transform: rotate(0deg); }
  10% { transform: rotate(-8deg); }
  20% { transform: rotate(8deg); }
  30% { transform: rotate(-8deg); }
  40% { transform: rotate(8deg); }
  50% { transform: rotate(-5deg); }
  60% { transform: rotate(5deg); }
  70% { transform: rotate(-3deg); }
  80% { transform: rotate(3deg); }
  90% { transform: rotate(-1deg); }
}

/* Flung away */
@keyframes flung {
  0% { transform: scale(1) rotate(0deg); opacity:1; }
  100% { transform: scale(0.3) rotate(720deg); opacity:0; }
}

/* Come back */
@keyframes comeback {
  0% { transform: scale(0.3) translateX(200px); opacity:0; }
  50% { transform: scale(1.2) translateX(-10px); opacity:1; }
  70% { transform: scale(0.9) translateX(5px); }
  100% { transform: scale(1) translateX(0); opacity:1; }
}

/* Double tap special */
@keyframes doubletap {
  0% { transform: scale(1); }
  15% { transform: scale(1.3) rotate(10deg); }
  30% { transform: scale(0.8) rotate(-10deg); }
  50% { transform: scale(1.2); }
  70% { transform: scale(0.95); }
  100% { transform: scale(1); }
}

/* Long press hide face */
@keyframes hideface {
  0% { transform: scale(1); }
  50% { transform: scale(1.1) rotate(5deg); }
  100% { transform: scale(1); }
}

/* Heat glow - warm blush */
@keyframes heatglow {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}

/* Hot pulse - intense blush */
@keyframes hotpulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.1); }
}

.state-idle #pet { animation: breathe 3s ease-in-out infinite; }
.state-poked #pet { animation: poked 0.5s ease forwards; }
.state-angry #pet { animation: angry 0.6s ease forwards; }
.state-flung #pet { animation: flung 0.4s ease forwards; }
.state-comeback #pet { animation: comeback 0.6s ease forwards; }
.state-doubletap #pet { animation: doubletap 0.6s ease forwards; }
.state-hideface #pet { animation: hideface 0.5s ease forwards; }
.state-heating #pet { animation: breathe 3s ease-in-out infinite; }
.state-hot #pet { animation: doubletap 0.6s ease forwards; }

#heat-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at 50% 60%, rgba(255,100,100,0.3), transparent 70%);
  opacity: 0; pointer-events: none; border-radius: 50%;
  transition: opacity 0.5s ease;
}
#heat-overlay.heating { opacity: 0.4; animation: heatglow 2s ease-in-out infinite; }
#heat-overlay.hot { opacity: 0.7; animation: hotpulse 1s ease-in-out infinite; }
</style>
</head>
<body>
<div id="pet-container" class="state-idle">
  <div id="heat-overlay"></div>
  <svg id="pet" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Face circle -->
    <circle cx="100" cy="110" r="70" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    <!-- Ears -->
    <path d="M55 60 L45 25 L80 50 Z" fill="#FFB6C1" stroke="#E0E0E0" stroke-width="1"/>
    <path d="M145 60 L155 25 L120 50 Z" fill="#FFB6C1" stroke="#E0E0E0" stroke-width="1"/>
    <!-- Eyes -->
    <g id="eyes-normal">
      <circle cx="75" cy="105" r="8" fill="#333333"/>
      <circle cx="125" cy="105" r="8" fill="#333333"/>
      <circle cx="78" cy="102" r="3" fill="#FFFFFF"/>
      <circle cx="128" cy="102" r="3" fill="#FFFFFF"/>
    </g>
    <!-- Hidden eyes (for states) -->
    <g id="eyes-happy" style="display:none">
      <path d="M65 105 Q75 95 85 105" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <path d="M115 105 Q125 95 135 105" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="eyes-angry" style="display:none">
      <line x1="65" y1="95" x2="85" y2="100" stroke="#333" stroke-width="2.5"/>
      <circle cx="75" cy="108" r="7" fill="#333333"/>
      <line x1="115" y1="95" x2="135" y2="100" stroke="#333" stroke-width="2.5"/>
      <circle cx="125" cy="108" r="7" fill="#333333"/>
    </g>
    <g id="eyes-hide" style="display:none">
      <line x1="65" y1="105" x2="85" y2="105" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <line x1="115" y1="105" x2="135" y2="105" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Tear mole -->
    <circle cx="88" cy="115" r="2.5" fill="#333333"/>
    <!-- Blush -->
    <ellipse cx="60" cy="120" rx="10" ry="6" fill="#FFB6C1" opacity="0.5"/>
    <ellipse cx="140" cy="120" rx="10" ry="6" fill="#FFB6C1" opacity="0.5"/>
    <!-- Mouth normal -->
    <g id="mouth-normal">
      <path d="M88 130 Q95 138 100 135 Q105 138 112 130" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="mouth-open" style="display:none">
      <ellipse cx="100" cy="133" rx="8" ry="6" fill="#FF8888" stroke="#333" stroke-width="1.5"/>
    </g>
    <g id="mouth-pout" style="display:none">
      <circle cx="100" cy="132" r="5" fill="none" stroke="#333" stroke-width="2"/>
    </g>
  </svg>
  <img id="custom-image" style="display:none; width:100%; height:100%; object-fit:contain;">
</div>
<script>
const container = document.getElementById('pet-container');
const petSvg = document.getElementById('pet');
const customImage = document.getElementById('custom-image');
let currentState = 'idle';
let stateTimer = null;

function setState(state, duration) {
  if (stateTimer) clearTimeout(stateTimer);
  container.className = 'state-' + state;
  currentState = state;
  
  // Switch face features
  setFace(state);
  
  if (duration) {
    stateTimer = setTimeout(() => {
      setState('idle', 0);
    }, duration);
  }
}
function setFace(state) {
  // Reset all
  document.getElementById('eyes-normal').style.display = 'none';
  document.getElementById('eyes-happy').style.display = 'none';
  document.getElementById('eyes-angry').style.display = 'none';
  document.getElementById('eyes-hide').style.display = 'none';
  document.getElementById('mouth-normal').style.display = 'none';
  document.getElementById('mouth-open').style.display = 'none';
  document.getElementById('mouth-pout').style.display = 'none';
  
  switch(state) {
    case 'poked':
      document.getElementById('eyes-happy').style.display = '';
      document.getElementById('mouth-open').style.display = '';
      break;
    case 'angry':
      document.getElementById('eyes-angry').style.display = '';
      document.getElementById('mouth-pout').style.display = '';
      break;
    case 'doubletap':
      document.getElementById('eyes-happy').style.display = '';
      document.getElementById('mouth-open').style.display = '';
      break;
    case 'hideface':
      document.getElementById('eyes-hide').style.display = '';
      document.getElementById('mouth-pout').style.display = '';
      break;
    case 'flung':
      document.getElementById('eyes-angry').style.display = '';
      document.getElementById('mouth-open').style.display = '';
      break;
    case 'comeback':
      document.getElementById('eyes-happy').style.display = '';
      document.getElementById('mouth-normal').style.display = '';
      break;
    default:
      document.getElementById('eyes-normal').style.display = '';
      document.getElementById('mouth-normal').style.display = '';
  }
}
// Expose to Android
function triggerState(state, durationMs) {
  setState(state, durationMs || 1000);
}
function setCustomImage(path) {
    petSvg.style.display = 'none';
    customImage.src = path;
    customImage.style.display = 'block';
}
function resetToDefault() {
    customImage.style.display = 'none';
    customImage.src = '';
    petSvg.style.display = 'block';
}
// Heat visual feedback
const heatOverlay = document.getElementById('heat-overlay');
function progressHeat(value) {
    heatOverlay.className = '';
    if (value >= 60) {
        heatOverlay.className = 'hot';
    } else if (value >= 30) {
        heatOverlay.className = 'heating';
    }
}
// Initialize
setState('idle', 0);
</script>
</body>
</html>
